spring.application.name=associacao
server.port=8080

# Credenciais locais (não versionadas): copie application-local.properties.example
# para application-local.properties e preencha, ou use as variáveis de ambiente abaixo.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost/associacao}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Segredo usado para assinar os tokens JWT (HS256, exige >= 32 bytes) e tempo de expiração em ms (padrão: 24h).
# O valor abaixo serve apenas para desenvolvimento: em produção, defina JWT_SECRET com um valor próprio e secreto.
jwt.secret=${JWT_SECRET:qB5VKdulNWLpM7eq3tDfly0xHgW+Dmyojmz+uGxwFnlw1wZbx+2JohQigxhAa6j2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# A autenticação é toda feita via JWT (AuthService/JwtAuthenticationFilter); não usamos o
# AuthenticationManager padrão do Spring Boot, então essa autoconfiguração (que geraria um
# usuário/senha aleatórios a cada start só para logar no console) fica desligada.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
